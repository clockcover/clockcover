name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the checkout; nothing here writes to the repo.
permissions:
  contents: read

jobs:
  guards:
    name: typecheck · markdownlint · tests · build · repo scan · commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint needs the commit range
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 — version comes from package.json `packageManager`
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint:md
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_API_URL: https://api.clockcover.com
          VITE_CONSOLE_URL: https://console.clockcover.com
      - name: Workers bundle (wrangler deploy --dry-run, no credentials needed)
        run: pnpm -r --filter './apps/*' exec wrangler deploy --dry-run
      - name: Migrations match the Drizzle schema
        run: |
          pnpm --filter @clockcover/api exec drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain apps/api/migrations)" ]; then
            echo "::error::apps/api schema changed without a migration — run pnpm db:generate"; git status --porcelain apps/api/migrations; exit 1
          fi
      - name: Scan every tracked file with synthetic-only and no-secrets
        run: pnpm guards:scan
      - name: commitlint (PR commits)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: commitlint (PR title — it becomes the squash commit on main)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
      - name: commitlint (pushed commits)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: pnpm exec commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose
