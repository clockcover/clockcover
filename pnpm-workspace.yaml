packages:
  - "apps/*"
  - "packages/*"

# Supply chain: never install a version published less than 3 days ago.
minimumReleaseAge: 4320

# Lifecycle scripts stay off. These two ship prebuilt binaries as optional
# dependencies and work without their postinstall; `false` records that we
# chose not to run it (docs/contributing.md § Supply chain).
allowBuilds:
  esbuild: false
  workerd: false
